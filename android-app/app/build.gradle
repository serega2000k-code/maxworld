plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.maxworld.game'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.maxworld.game'
        minSdk 23
        targetSdk 35
        versionCode 51
        versionName '5.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
